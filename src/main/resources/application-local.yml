# 프로젝트 루트의 .env 를 속성으로 읽는다 (없으면 무시). `./gradlew bootRun --args='--spring.profiles.active=local'` 만으로 키가 주입된다
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/stagelog?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: stagelog
    password: stagelog
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

stagelog:
  auth:
    cookie-secure: false
