# datasource·redis 접속 정보는 Testcontainers @ServiceConnection 이 주입한다 (IntegrationTest 참고)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

stagelog:
  jwt:
    # 테스트 전용 고정 비밀키 (32바이트 이상). 운영값은 환경변수로만 주입한다
    secret: stagelog-test-jwt-secret-0123456789abcdef
  auth:
    cookie-secure: false
  kakao:
    # 비어 있지 않아야 한글 검색이 Kakao 경로로 간다 (MockRestServiceServer 가 응답)
    rest-api-key: test-kakao-key
  locationiq:
    token: test-locationiq-token
  # 행사 동기화 클라이언트가 "키 있음" 경로를 타도록 하는 테스트 값 (MockRestServiceServer 가 응답)
  kopis:
    service-key: test-kopis-key
    artist-keyword: 스타더스트 클럽
  ticketmaster:
    api-key: test-ticketmaster-key
    keyword: STARDUST CLUB
  naver-calendar:
    published-key: test-naver-published-key
  youtube:
    # 테스트 전용 고정 키 (32바이트 base64). 리프레시 토큰 암호화 경로를 통합 테스트에서 탄다
    token-key: c3RhZ2Vsb2ctdGVzdC15b3V0dWJlLXRva2VuLWtleSE=
    playlist-title-prefix: 스타더스트 클럽
  setlistfm:
    api-key: test-setlistfm-key
    artist-mbid: 00000000-0000-4000-8000-00000000a001
  push:
    # 테스트는 DispatchDuePushJobs.runCycle 을 직접 부른다
    dispatch-cron: "-"
    resync-cron: "-"
    vapid:
      # 실키가 아닌 자리표시자. 비밀키가 비어 있어 WebPushSender 는 키를 파싱하지 않고, 통합 테스트는 PushSenderPort 를 목으로 바꾼다
      public-key: test-vapid-public-key

jan:
  storage:
    # 테스트는 StorageCleanup.deleteDue 를 직접 부른다
    cleanup-cron: "-"
  youtube:
    quota:
      # 테스트는 retryDeferred 를 직접 부른다
      reset-cron: "-"
  pipeline:
    async-apply:
      # 테스트는 기존 동기 처리가 기본이다. Queue 를 쓰는 LocalStack 통합 테스트만 켠다 (켜면 SQS 를 부르므로 S3 목 기반 테스트에서는 켜지 않는다)
      enabled: false
  queue:
    # LocalStack 통합 테스트가 플래그를 켜면 기동 시 Queue·DLQ 를 만든다 (꺼져 있으면 아무 Queue 도 만들지 않는다)
    auto-create: true
    consumer:
      wait-seconds: 1
