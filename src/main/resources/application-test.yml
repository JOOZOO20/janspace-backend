# datasource·redis 접속 정보는 Testcontainers @ServiceConnection 이 주입한다 (IntegrationTest 참고)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

janspace:
  jwt:
    # 테스트 전용 고정 비밀키 (32바이트 이상). 운영값은 환경변수로만 주입한다
    secret: janspace-test-jwt-secret-0123456789abcdef
  auth:
    cookie-secure: false
  kakao:
    # 비어 있지 않아야 한글 검색이 Kakao 경로로 간다 (MockRestServiceServer 가 응답)
    rest-api-key: test-kakao-key
  locationiq:
    token: test-locationiq-token
  # 행사 동기화 클라이언트가 "키 있음" 경로를 타도록 하는 테스트 값 (MockRestServiceServer 가 응답)
  kopis:
    service-key: test-kopis-key
  ticketmaster:
    api-key: test-ticketmaster-key
  naver-calendar:
    published-key: test-naver-published-key
  youtube:
    # 테스트 전용 고정 키 (32바이트 base64). 리프레시 토큰 암호화 경로를 통합 테스트에서 탄다
    token-key: amFuc3BhY2UtdGVzdC15b3V0dWJlLXRva2VuLWtleSE=
  setlistfm:
    api-key: test-setlistfm-key
    artist-mbid: 0f7e6a3c-1b2d-4e5f-8a9b-0c1d2e3f4a5b
  push:
    # 테스트는 DispatchDuePushJobs.runCycle 을 직접 부른다
    dispatch-cron: "-"
    resync-cron: "-"
    vapid:
      # 실키가 아닌 자리표시자. 비밀키가 비어 있어 WebPushSender 는 키를 파싱하지 않고, 통합 테스트는 PushSenderPort 를 목으로 바꾼다
      public-key: test-vapid-public-key
