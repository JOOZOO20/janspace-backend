spring:
  application:
    name: janspace
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s
  jackson:
    time-zone: UTC
    # Jackson 3: WRITE_DATES_AS_TIMESTAMPS 는 DateTimeFeature 로 옮겨졌다 (기본 false, 명시용)
    datatype:
      datetime:
        write-dates-as-timestamps: false

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

janspace:
  front-url: ${JANSPACE_FRONT_URL:http://localhost:3000}
  jwt:
    secret: ${JANSPACE_JWT_SECRET:}
    access-ttl: 30m
  auth:
    refresh-ttl: 14d
    # 리프레시 쿠키 Secure 속성. local·test 프로파일은 false
    cookie-secure: true
  oauth:
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      authorize-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      userinfo-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://openidconnect.googleapis.com/v1/userinfo
      scope: openid email profile
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    address-search-uri: https://dapi.kakao.com/v2/local/search/address.json
  locationiq:
    token: ${LOCATIONIQ_TOKEN:}
    search-uri: https://us1.locationiq.com/v1/search
  discord:
    # 비어 있으면 알림을 보내지 않고 INFO 로그만 남긴다 (DiscordWebhookClient)
    webhook-url: ${DISCORD_WEBHOOK_URL:}
