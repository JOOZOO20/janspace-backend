spring:
  application:
    name: janspace
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
    # Jackson 3: WRITE_DATES_AS_TIMESTAMPS 는 DateTimeFeature 로 옮겨졌다 (기본 false, 명시용)
    datatype:
      datetime:
        write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          # Stage 1(account) 에서 로그인 흐름을 붙인다. 빈 값이면 Boot 가 등록을 거부하므로 기본값 dummy
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy}
            client-secret: ${NAVER_CLIENT_SECRET:dummy}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/{registrationId}/callback"
            scope: name,email
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            redirect-uri: "{baseUrl}/api/v1/auth/{registrationId}/callback"
            scope: openid,profile,email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

janspace:
  front-url: ${JANSPACE_FRONT_URL:http://localhost:3000}
  jwt:
    secret: ${JANSPACE_JWT_SECRET:}
    access-ttl: 30m
  auth:
    refresh-ttl: 14d
