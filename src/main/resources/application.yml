spring:
  application:
    name: stagelog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s
  servlet:
    multipart:
      # 앨범커버 5MB(코드에서 검증) 와 곡 마스터 엑셀. 기본 1MB 로는 커버 업로드가 컨트롤러 전에 거부된다
      max-file-size: 10MB
      max-request-size: 10MB
  messages:
    # 푸시 문구 번들 (notification 리소스). 요청 로케일 번들이 없으면 기본 파일(ko) 로 간다
    basename: notification/push-messages
    fallback-to-system-locale: false
  jackson:
    time-zone: UTC
    # Jackson 3: WRITE_DATES_AS_TIMESTAMPS 는 DateTimeFeature 로 옮겨졌다 (기본 false, 명시용)
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      # PATCH 의 Optional 필드: 키 없음 = null(유지), "키": null = Optional.empty()(지우기). 끄면 Jackson 3 는 둘 다 empty 로 읽는다
      use-null-for-missing-reference-values: true

server:
  forward-headers-strategy: framework

logging:
  pattern:
    # RequestIdFilter 가 MDC 에 넣은 요청 ID. 요청 밖(스케줄러·비동기) 로그는 빈 괄호로 나온다
    correlation: "[%X{requestId:-}] "

# actuator 는 health 만 노출한다 (배포 헬스체크용). 나머지 엔드포인트는 어느 환경에서도 열지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

stagelog:
  front-url: ${STAGELOG_FRONT_URL:http://localhost:3000}
  jwt:
    secret: ${STAGELOG_JWT_SECRET:}
    access-ttl: 30m
  auth:
    refresh-ttl: 14d
    # 리프레시 쿠키 Secure 속성. local·test 프로파일은 false
    cookie-secure: true
  oauth:
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      authorize-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      userinfo-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://openidconnect.googleapis.com/v1/userinfo
      scope: openid email profile
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    address-search-uri: https://dapi.kakao.com/v2/local/search/address.json
  locationiq:
    token: ${LOCATIONIQ_TOKEN:}
    search-uri: https://us1.locationiq.com/v1/search
  discord:
    # 비어 있으면 알림을 보내지 않고 INFO 로그만 남긴다 (DiscordWebhookClient)
    webhook-url: ${DISCORD_WEBHOOK_URL:}
  storage:
    # S3. 자격 증명은 SDK 기본 체인(EC2 IAM 역할, 로컬 ~/.aws 또는 AWS_* 환경변수)
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    cdn-base-url: ${CDN_BASE_URL:}
  aws:
    # AWS 호환 엔드포인트(LocalStack 등). 비어 있으면 실제 AWS 를 부른다. LocalStack 통합 테스트만 채운다
    endpoint: ""
  deepl:
    api-key: ${DEEPL_API_KEY:}
  api-base-url: ${STAGELOG_API_BASE_URL:http://localhost:8080}
  youtube:
    client-id: ${YOUTUBE_CLIENT_ID:}
    client-secret: ${YOUTUBE_CLIENT_SECRET:}
    # 리프레시 토큰 DB 암호화 키(AES-256, base64 32바이트). 비어 있으면 평문 저장 + 기동 경고 (RefreshTokenCipher)
    token-key: ${YOUTUBE_TOKEN_KEY:}
    # 재생목록 제목 앞머리(보통 아티스트 이름). 비어 있으면 "{날짜} {공연장} 셋리" 만 쓴다
    playlist-title-prefix: ${YOUTUBE_PLAYLIST_TITLE_PREFIX:}
    # YouTube Data API·구글 토큰 주소. 로컬에서 Fake 서버를 붙일 때만 바꾼다
    api-base-uri: https://www.googleapis.com/youtube/v3
    token-uri: https://oauth2.googleapis.com/token
  setlist:
    # 계정당 하루(UTC 날짜) 셋리 편집 횟수
    edits-per-day: 20
  naver-calendar:
    # 비공식 내부 API. 공개 캘린더 키는 기본값이 없다 (.env.example 참고). 호출에는 키만 쓰고 캘린더 ID 는 필요 없다
    published-key: ${NAVER_CALENDAR_PUBLISHED_KEY:}
    schedule-list-uri: https://calendar.naver.com/ajax/public/GetScheduleList
    referer-uri: https://calendar.naver.com/publicCalendar
  kopis:
    service-key: ${KOPIS_SERVICE_KEY:}
    # 공연명 검색어(아티스트 이름). 비어 있으면 KOPIS 보강을 건너뛴다
    artist-keyword: ${KOPIS_ARTIST_KEYWORD:}
    base-uri: https://www.kopis.or.kr/openApi/restful
  ticketmaster:
    api-key: ${TICKETMASTER_API_KEY:}
    base-uri: https://app.ticketmaster.com/discovery/v2
    # 아티스트(attraction) 검색어. 비어 있으면 Ticketmaster 동기화를 건너뛴다
    keyword: ${TICKETMASTER_KEYWORD:}
  setlistfm:
    api-key: ${SETLISTFM_API_KEY:}
    artist-mbid: ${SETLISTFM_ARTIST_MBID:}
    base-uri: https://api.setlist.fm/rest/1.0
  sync:
    # 행사 출처 동기화 스케줄 (Asia/Seoul). test 프로파일에서는 트리거 자체를 등록하지 않는다
    cron:
      naver: "0 0 6,18 * * *"
      kopis: "0 30 4 * * *"
      ticketmaster: "0 0 5 * * *"
      setlistfm: "0 0 7 * * *"
  photocard:
    # 유저당 월 제한(UTC 월 경계, 미삭제 기준)과 이미지 긴 변 상한 (카드·스티커 max-px, 네컷 fourcut-max-px)
    per-month: 10
    max-px: 1350
    fourcut-max-px: 3240
  push:
    # 1분 주기 디스패처. "-" 면 비활성
    dispatch-cron: "0 * * * * *"
    # 하루 1회(Asia/Seoul) 어제 이후 행사의 기록 알림 재예약. 일정 변경 리스너 실패로 빠진 예약을 메운다. "-" 면 비활성
    resync-cron: "0 30 3 * * *"
    # 기록 알림 예약 시각. 종료 시각(관리자 입력)이 있으면 종료 + 10분이고, 없으면 아래 값으로 추정한다.
    # 시작 + 공연 시간(KOPIS·관리자) + official-buffer. 공연은 예정 시간에 거의 맞춰 끝나므로 종료 시각이 있을 때와 같은 여유
    official-buffer: 10m
    # 시작 + 추정 공연 시간 + estimated-buffer. 콘서트는 같은 시즌 회차의 공연 시간, 없으면 concert-default-duration
    estimated-buffer: 20m
    concert-default-duration: 150m
    # 페스티벌·대학 축제·무료·방송·기타 출연
    other-default-duration: 60m
    # 날짜만 있으면 행사 당일 공연장 현지 시각 (RECORD_FALLBACK). 따옴표가 없으면 YAML 이 60진수 정수로 읽는다
    date-only-local-time: "22:00"
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:}

# 고도화 작업(JAN-*) 설정 플래그
jan:
  storage:
    versioned-key:
      # 이미지 key 에 내용 sha256 을 넣고(같은 내용은 PUT 생략) Cache-Control immutable 로 저장한다. false 면 고정 key 덮어쓰기(기존 동작)
      enabled: true
    # 교체로 빠진 이전 key 삭제 배치 (Asia/Seoul, 하루 1회). "-" 면 비활성
    cleanup-cron: "0 0 4 * * *"
  # 동기화 실행 Lease (job_leases). enabled=false 면 JVM 안 CAS 로 막던 이전 동작. TTL 안에 Heartbeat 가 끊기면 다른 서버가 이어받는다
  sync:
    lease:
      enabled: true
      ttl-seconds: 120
      heartbeat-seconds: 30
    kopis:
      isolate-items:
        # KOPIS 항목 하나의 오류를 sync_item_failures 에 남기고 계속 처리해 실행을 PARTIAL 로 끝낸다. false 면 첫 오류에서 실행 전체가 멈추는 이전 동작
        enabled: true
  pipeline:
    async-apply:
      # 수집과 후처리(병합·포스터 입수)를 SQS(jan-source-apply, jan-poster-ingest)로 나눈다. false 면 동기화 안에서 바로 접고 포스터를 받는다(기존 동작).
      # 측정(docs/measurements/JAN-04.md) 후 기본값을 켰다. SQS 가 없는 환경(local·develop·prod·test 프로파일)은 각 프로파일에서 끈다
      enabled: true
  # Outbox Relay·Queue Consumer (같은 프로세스의 전용 스레드). Queue 이름이 키인 값은 Queue 를 추가할 때 같이 넣는다.
  # Relay 는 jan.queue.relay.enabled 로 강제할 수 있고, 비워 두면 켜진 Consumer(수집·후처리 분리, 미디어 변환)가 하나라도 있을 때 돈다
  queue:
    consumer:
      # Queue 마다 polling thread 수. 0 이면 이 프로세스는 Consumer 를 띄우지 않는다
      threads: 2
      # SQS Long Polling 대기(최대 20초)
      wait-seconds: 20
    # Visibility Timeout. 처리 중에는 30초마다 이 값으로 연장한다
    visibility-seconds:
      jan-source-apply: 60
      jan-poster-ingest: 120
      # rendition Lease(90초)와 같다
      jan-media-transcode: 90
      jan-media-backfill: 90
    # 일시 실패 n 번째(1~4)의 재전달 대기. 5번째 실패는 DLQ (maxReceiveCount 5)
    backoff-seconds: [30, 120, 600, 1800]
    # 기동 시 켜진 Queue 와 DLQ 생성. 운영은 인프라에서 만든다
    auto-create: false
  media:
    ffmpeg:
      # 실행 명령 prefix (쉼표로 구분). Worker 이미지(Dockerfile) 안에서는 기본값, 로컬은 docker,exec,-i,<컨테이너>,ffmpeg
      command: ffmpeg
      probe-command: ffprobe
    transcode:
      # 원본 저장 시 asset·rendition 행과 변환 메시지(jan-media-transcode)를 만들고 Worker 가 화면별 WebP·JPEG 를 만든다.
      # false 면 원본만 서빙하는 기존 동작(images 의 모든 자리가 원본 URL). 켜면 기동 시 libwebp 를 확인한다
      enabled: false
      # FFmpeg·ffprobe 실행 1회의 제한 시간. 넘기면 프로세스를 강제 종료하고 TIMEOUT 실패
      timeout: 60s
    worker:
      # 이 프로세스의 변환 polling thread 수 (신규·백필 Queue 를 함께 받는다)
      concurrency: 2
    queue:
      # true: 백필을 jan-media-backfill 로 발행하고 신규 priority-ratio 회 수신마다 백필 1회. false: 백필도 신규 Queue 로 (측정 비교용)
      split: true
      priority-ratio: 4
    backfill:
      # 초당 등록·발행 asset 수
      rate-per-second: 20
    recovery:
      # Zombie 회수 주기 (Lease 가 만료된 PROCESSING -> PENDING + 재발행)
      interval: 60s
  youtube:
    diff-sync:
      # true: 바뀐 항목만 반영(PlaylistDiff). false: 수정 전 방식(다르면 전부 지우고 다시 넣기)
      enabled: true
    quota:
      # 태평양 날짜 하루 예산(unit). 기본 일일 한도 10,000 중 남는 1,000 은 여유분으로 어느 bucket 에도 주지 않는다
      auto-units: 8000
      manual-units: 1000
      # 리셋(태평양 자정) 직후 일일 행 생성 + 미룬 동기화 재시도 (America/Los_Angeles). "-" 면 비활성
      reset-cron: "0 5 0 * * *"
