spring:
  application:
    name: janspace
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s
  servlet:
    multipart:
      # 앨범커버 5MB(코드에서 검증) 와 곡 마스터 엑셀. 기본 1MB 로는 커버 업로드가 컨트롤러 전에 거부된다
      max-file-size: 10MB
      max-request-size: 10MB
  messages:
    # 푸시 문구 번들 (notification 리소스). 요청 로케일 번들이 없으면 기본 파일(ko) 로 간다
    basename: notification/push-messages
    fallback-to-system-locale: false
  jackson:
    time-zone: UTC
    # Jackson 3: WRITE_DATES_AS_TIMESTAMPS 는 DateTimeFeature 로 옮겨졌다 (기본 false, 명시용)
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      # PATCH 의 Optional 필드: 키 없음 = null(유지), "키": null = Optional.empty()(지우기). 끄면 Jackson 3 는 둘 다 empty 로 읽는다
      use-null-for-missing-reference-values: true

server:
  forward-headers-strategy: framework

logging:
  pattern:
    # RequestIdFilter 가 MDC 에 넣은 요청 ID. 요청 밖(스케줄러·비동기) 로그는 빈 괄호로 나온다
    correlation: "[%X{requestId:-}] "

# actuator 는 health 만 노출한다 (배포 헬스체크용). 나머지 엔드포인트는 어느 환경에서도 열지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

janspace:
  front-url: ${JANSPACE_FRONT_URL:http://localhost:3000}
  jwt:
    secret: ${JANSPACE_JWT_SECRET:}
    access-ttl: 30m
  auth:
    refresh-ttl: 14d
    # 리프레시 쿠키 Secure 속성. local·test 프로파일은 false
    cookie-secure: true
  oauth:
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      authorize-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      userinfo-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://openidconnect.googleapis.com/v1/userinfo
      scope: openid email profile
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    address-search-uri: https://dapi.kakao.com/v2/local/search/address.json
  locationiq:
    token: ${LOCATIONIQ_TOKEN:}
    search-uri: https://us1.locationiq.com/v1/search
  discord:
    # 비어 있으면 알림을 보내지 않고 INFO 로그만 남긴다 (DiscordWebhookClient)
    webhook-url: ${DISCORD_WEBHOOK_URL:}
  storage:
    # S3. 자격 증명은 SDK 기본 체인(EC2 IAM 역할, 로컬 ~/.aws 또는 AWS_* 환경변수)
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    cdn-base-url: ${CDN_BASE_URL:}
  deepl:
    api-key: ${DEEPL_API_KEY:}
  api-base-url: ${JANSPACE_API_BASE_URL:http://localhost:8080}
  youtube:
    client-id: ${YOUTUBE_CLIENT_ID:}
    client-secret: ${YOUTUBE_CLIENT_SECRET:}
  setlist:
    # 계정당 하루(UTC 날짜) 셋리 편집 횟수
    edits-per-day: 20
  naver-calendar:
    # 비공식 내부 API. 공개 캘린더 키는 기본값이 없다 (.env.example 참고). 호출에는 키만 쓰고 캘린더 ID 는 필요 없다
    published-key: ${NAVER_CALENDAR_PUBLISHED_KEY:}
    schedule-list-uri: https://calendar.naver.com/ajax/public/GetScheduleList
    referer-uri: https://calendar.naver.com/publicCalendar
  kopis:
    service-key: ${KOPIS_SERVICE_KEY:}
    base-uri: https://www.kopis.or.kr/openApi/restful
  ticketmaster:
    api-key: ${TICKETMASTER_API_KEY:}
    base-uri: https://app.ticketmaster.com/discovery/v2
    keyword: JANNABI
  setlistfm:
    api-key: ${SETLISTFM_API_KEY:}
    artist-mbid: ${SETLISTFM_ARTIST_MBID:}
    base-uri: https://api.setlist.fm/rest/1.0
  sync:
    # 행사 출처 동기화 스케줄 (Asia/Seoul). test 프로파일에서는 트리거 자체를 등록하지 않는다
    cron:
      naver: "0 0 6,18 * * *"
      kopis: "0 30 4 * * *"
      ticketmaster: "0 0 5 * * *"
      setlistfm: "0 0 7 * * *"
  photocard:
    # 유저당 월 제한(UTC 월 경계, 미삭제 기준)과 이미지 긴 변 상한
    per-month: 10
    max-px: 1350
  push:
    # 1분 주기 디스패처. "-" 면 비활성
    dispatch-cron: "0 * * * * *"
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:}
