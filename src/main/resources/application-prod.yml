# 운영(EC2 -> RDS). 접속 정보는 환경변수로만 받는다 (.env.example 참고). 스키마는 validate 만 (application.yml)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# 운영은 Swagger 를 닫는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

stagelog:
  auth:
    # 운영은 HTTPS 전용. 리프레시 쿠키 Secure 를 명시한다 (기본값과 같음)
    cookie-secure: true

logging:
  level:
    root: INFO
    com.stagelog: INFO

# SQS 비용 승인 전까지 수집·후처리 분리를 끈다 (명세서 결정 필요 사항의 결정 전 기본값). 켜면 Queue·DLQ 는 인프라에서 먼저 만든다
jan:
  pipeline:
    async-apply:
      enabled: false
  # SQS 비용 승인 전까지 이미지 변환을 끈다 (원본만 서빙). 켜면 Worker 이미지(Dockerfile)와 Queue·DLQ 가 먼저 있어야 한다
  media:
    transcode:
      enabled: false
  queue:
    auto-create: false
