<desc id="description">AWS 내부의 MySQL, Redis, S3와 단일 Spring Boot API 서버. 공연 일정, 로그인 및 장소 검색, 음악 및 콘텐츠, 알림 전송 기능은 API 서버 안에서 함께 배포. 제삼자 API 제공자와 클라이언트만 AWS 경계 밖에 표시.</desc>
